<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twosday">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#221F2C">
<title>Twosday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#FAF6EF;
    --ink:#5C564C;
    --brand:#221F2C;
    --accent:#96263C;
    --teal:#236663;
    --gold:#9C6A16;
    --gold-soft:#F3E4C4;
    --green:#2E6F4E;
    --green-soft:#DCEBE1;
    --white:#FFFFFF;
    --radius:14px;

    --ink-soft: color-mix(in srgb, var(--ink) 55%, var(--paper) 45%);
    --paper-dim: color-mix(in srgb, var(--paper) 88%, var(--ink) 12%);
    --line: color-mix(in srgb, var(--ink) 20%, var(--paper) 80%);
    --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--paper) 84%);
    --teal-soft: color-mix(in srgb, var(--teal) 16%, var(--paper) 84%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces',serif;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  button{font-family:inherit;}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* ---- Top bar ---- */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:30px;height:30px;flex-shrink:0;}
  .brand h1{font-size:22px; margin:0; line-height:1; color:var(--brand);}
  .me-pill{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    background:var(--paper-dim); border:1px solid var(--line);
    padding:6px 10px; border-radius:100px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .me-dot{width:8px;height:8px;border-radius:50%;}
  /* ---- Main scroll area ---- */
  .view{
    flex:1;
    padding:18px 18px 96px;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
  }
  .section-label{
    font-size:13px; font-weight:600; color:var(--ink-soft);
    margin:22px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-label:first-child{margin-top:4px;}
  .count-chip{
    background:var(--accent); color:var(--white);
    font-size:11px; font-weight:700; padding:1px 7px; border-radius:100px;
  }
  /* ---- Empty state ---- */
  .empty{
    text-align:center; padding:44px 18px; color:var(--ink-soft);
  }
  .empty .display{font-size:19px; color:var(--ink); margin-bottom:6px;}
  .empty p{font-size:14px; line-height:1.5; margin:0;}
  /* ---- Event card ---- */
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    border-radius:10px;
    padding:13px 14px;
    margin-bottom:10px;
    display:flex; gap:12px;
    cursor:pointer;
    text-align:left;
    width:100%;
    align-items:flex-start;
  }
  .card.status-confirmed{border-left-color:var(--green);}
  .card.status-declined{border-left-color:var(--ink-soft); opacity:0.6;}
  .card-thumb{
    width:52px; height:52px; border-radius:8px; object-fit:cover;
    flex-shrink:0; background:var(--paper-dim);
  }
  .card-thumb.placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .card-body{flex:1; min-width:0;}
  .card-title{font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 3px; line-height:1.25;}
  .card-meta{font-size:12.5px; color:var(--ink-soft); margin:0; line-height:1.4;}
  .card-tags{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap;}
  .tag{
    font-size:11px; font-weight:600; padding:2px 8px; border-radius:100px;
  }
  .tag.pending{background:var(--gold-soft); color:var(--gold);}
  .tag.confirmed{background:var(--green-soft); color:var(--green);}
  .tag.declined{background:var(--paper-dim); color:var(--ink-soft);}
  .tag.waiting{background:var(--teal-soft); color:var(--teal);}
  /* ---- Action buttons on request cards ---- */
  .action-row{display:flex; gap:8px; margin-top:10px;}
  .btn{
    font-family:'Work Sans',sans-serif;
    font-weight:600; font-size:13.5px;
    padding:9px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--white); color:var(--ink); cursor:pointer;
  }
  .btn.accept{background:var(--green); border-color:var(--green); color:var(--white);}
  .btn.decline{background:var(--white); border-color:var(--line); color:var(--ink-soft);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--white);}
  .btn.block{width:100%; text-align:center; padding:13px;}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
  /* ---- Bottom nav ---- */
  .navbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    max-width:480px; margin:0 auto;
    background:var(--white);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:11px 0 9px; background:none; border:none; color:var(--ink-soft);
    cursor:pointer; position:relative; font-size:11.5px; font-weight:600;
  }
  .nav-btn.active{color:var(--accent);}
  .nav-btn svg{width:22px;height:22px;}
  .nav-badge{
    position:absolute; top:4px; right:calc(50% - 20px);
    background:var(--accent); color:white; font-size:10px; font-weight:700;
    min-width:16px; height:16px; border-radius:100px; display:flex; align-items:center; justify-content:center;
    padding:0 3px;
  }
  /* ---- Form ---- */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=url], .field textarea{
    width:100%; font-family:'Work Sans',sans-serif; font-size:15px; color:var(--ink);
    background:var(--white); border:1px solid var(--line); border-radius:9px; padding:11px 12px;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .row2{display:flex; gap:10px;}
  .row2 .field{flex:1;}
  .img-drop{
    border:1.5px dashed var(--line); border-radius:10px; padding:16px; text-align:center;
    color:var(--ink-soft); font-size:13px; cursor:pointer; position:relative; overflow:hidden;
  }
  .img-drop img{width:100%; border-radius:8px; display:block;}
  .img-drop input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .checklist-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .checklist-row input[type=text]{flex:1;}
  .icon-btn{
    background:none; border:none; color:var(--ink-soft); font-size:18px; cursor:pointer;
    width:32px; height:32px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .add-item-btn{
    font-size:13px; font-weight:600; color:var(--accent); background:none; border:none;
    padding:6px 0; cursor:pointer;
  }
  /* ---- Setup / identity screens ---- */
  .center-screen{
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    justify-content:center; padding:32px 26px; max-width:480px; margin:0 auto;
  }
  .center-screen .brand-mark{width:44px;height:44px; margin-bottom:16px;}
  .center-screen h1{font-size:28px; margin:0 0 6px;}
  .center-screen p.sub{color:var(--ink-soft); font-size:14.5px; margin:0 0 28px; line-height:1.5;}
  .choice-btn{
    display:block; width:100%; text-align:left; background:var(--white);
    border:1.5px solid var(--line); border-radius:12px; padding:16px 18px;
    font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--ink);
    margin-bottom:10px; cursor:pointer;
  }
  .choice-btn:active{border-color:var(--accent);}
  /* ---- Modal / detail ---- */
  .overlay{
    position:fixed; inset:0; background:rgba(34,31,44,0.45); z-index:50;
    display:flex; align-items:flex-end;
  }
  .sheet{
    background:var(--paper); width:100%; max-width:480px; margin:0 auto;
    max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0;
    padding:20px 20px calc(28px + env(safe-area-inset-bottom));
  }
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:100px; margin:0 auto 16px;}
  .sheet-close{
    position:sticky; top:0; float:right; background:var(--white); border:1px solid var(--line);
    border-radius:100px; width:30px; height:30px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); margin-left:10px;
  }
  .detail-img{width:100%; border-radius:12px; margin-bottom:14px; display:block; max-height:220px; object-fit:cover;}
  .detail-title{font-size:23px; margin:0 0 4px;}
  .detail-meta{color:var(--ink-soft); font-size:14px; margin:0 0 14px; line-height:1.5;}
  .detail-desc{font-size:14.5px; line-height:1.6; margin:0 0 16px;}
  .link-btn{
    display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600;
    color:var(--teal); text-decoration:none; background:var(--teal-soft); padding:8px 12px;
    border-radius:9px; margin-bottom:16px;
  }
  .checklist-item{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:14.5px;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item .box{
    width:19px; height:19px; border-radius:5px; border:1.5px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--white);
  }
  .checklist-item.done .box{background:var(--green); border-color:var(--green);}
  .checklist-item.done span{text-decoration:line-through; color:var(--ink-soft);}
  .who-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .who-chip{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    padding:5px 10px; border-radius:100px; background:var(--paper-dim);
  }
  .who-chip .me-dot{width:7px;height:7px;}
  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--white); font-size:13.5px; font-weight:600;
    padding:10px 18px; border-radius:100px; z-index:60; opacity:0; pointer-events:none;
    transition:opacity 0.25s, transform 0.25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
  .loading{display:flex; justify-content:center; padding:60px 0; color:var(--ink-soft); font-size:14px;}
  /* ---- Splash (shown while loading, esp. from homescreen) ---- */
  .splash{
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; background:var(--paper);
  }
  .splash-mark{width:56px; height:56px; animation:pulse 1.6s ease-in-out infinite;}
  .splash-name{font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:var(--brand);}
  .splash-sub{font-size:13px; color:var(--ink-soft); margin-top:-8px;}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);}50%{opacity:0.55; transform:scale(0.94);}}
  /* ---- Add to Home Screen instructions ---- */
  .install-steps{margin:22px 0 30px;}
  .install-step{display:flex; gap:14px; margin-bottom:22px; align-items:flex-start;}
  .step-icon{
    width:50px; height:50px; border-radius:13px; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
  }
  .step-icon svg{width:25px; height:25px; stroke:var(--accent); fill:none;}
  .step-icon .num{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--ink); color:var(--white); font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .install-step p{margin:0; font-size:14.5px; line-height:1.5; padding-top:12px;}
  /* ---- Calendar grid ---- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-month-label{font-family:'Fraunces',serif; font-weight:600; font-size:17px;}
  .cal-nav{background:var(--white); border:1px solid var(--line); border-radius:9px; width:34px; height:34px; font-size:16px; color:var(--ink); cursor:pointer;}
  .cal-today-btn{background:none; border:none; color:var(--accent); font-size:12.5px; font-weight:700; cursor:pointer;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:4px;}
  .cal-cell{
    aspect-ratio:1; background:none; border:none; border-radius:10px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:2px;
  }
  .cal-cell.dim{opacity:0.32;}
  .cal-cell.selected{background:var(--accent-soft);}
  .cal-cell.today .cal-daynum{color:var(--accent); font-weight:700;}
  .cal-daynum{font-size:13px; font-weight:600; color:var(--ink);}
  .cal-dots{display:flex; gap:2px; height:5px;}
  .cal-dot{width:5px; height:5px; border-radius:50%; flex-shrink:0;}
  /* ---- New-event mode toggle ---- */
  .mode-toggle{display:flex; background:var(--paper-dim); border-radius:11px; padding:4px; margin-bottom:20px; gap:4px;}
  .mode-btn{flex:1; text-align:center; padding:9px 0; border:none; background:transparent; border-radius:8px; font-weight:600; font-size:13.5px; color:var(--ink-soft); cursor:pointer;}
  .mode-btn.active{background:var(--white); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,0.06);}
  .weekday-row{display:flex; gap:6px; flex-wrap:wrap;}
  .weekday-btn{
    width:34px; height:34px; border-radius:50%; border:1.3px solid var(--line); background:var(--white);
    color:var(--ink-soft); font-size:12px; font-weight:700; cursor:pointer;
  }
  .weekday-btn.active{background:var(--accent); border-color:var(--accent); color:var(--white);}
  .checkbox-row{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:600; color:var(--ink); cursor:pointer;}
  .checkbox-row input{width:18px; height:18px; accent-color:var(--accent);}
  /* ---- Settings ---- */
  input[type=color]{
    width:100%; height:44px; border:1px solid var(--line); border-radius:9px;
    padding:3px; background:var(--white); cursor:pointer;
  }
  .color-row{display:flex; align-items:center; gap:12px;}
  .color-row input[type=color]{width:52px; height:40px; flex-shrink:0; padding:2px;}
  .color-row .color-label{flex:1;}
  .color-row .color-label .name{font-size:14px; font-weight:600; color:var(--ink);}
  .color-row .color-label .hex{font-size:12px; color:var(--ink-soft);}
  /* ---- Help list ---- */
  .help-list{list-style:none; margin:0 0 20px; padding:0;}
  .help-list li{font-size:14.5px; line-height:1.6; color:var(--ink); margin-bottom:10px; padding-left:17px; position:relative;}
  .help-list li::before{content:'–'; position:absolute; left:0; color:var(--ink-soft);}
  .help-list li strong{color:var(--ink);}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE_OK = !!(window.storage && window.storage.get);

// ---------- storage helpers (tolerate missing keys) ----------
async function sget(key, shared){
  try{ const r = await window.storage.get(key, shared); return r ? r.value : null; }
  catch(e){ return null; }
}
async function sset(key, value, shared){
  try{ await window.storage.set(key, value, shared); return true; }
  catch(e){ console.error('storage set failed', e); return false; }
}
async function slist(prefix, shared){
  try{ const r = await window.storage.list(prefix, shared); return r ? r.keys : []; }
  catch(e){ return []; }
}

// ---------- app state ----------
let participants = null;   // [nameA, nameB]
let me = null;              // string
let events = {};            // id -> event
let birthdays = {};         // name -> 'YYYY-MM-DD'
let tab = 'calendar';       // calendar | requests | new
let detailId = null;        // open event id
let switching = false;
let showInstallTip = false; // shown once, first time, if not already installed
let showAddSheet = false;   // add-item bottom sheet
let addSheetKind = 'personal'; // personal | plan

const _today = new Date();
let calYear = _today.getFullYear();
let calMonth = _today.getMonth();
let selectedDate = todayIso();

let formDraft = { title:'', date:'', time:'', endTime:'', location:'', link:'', desc:'' };
let formRepeat = { enabled:false, days:[], until:'' };

function pad2(n){ return String(n).padStart(2,'0'); }
function todayIso(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function buildMonthMatrix(year, month){
  const first = new Date(year, month, 1);
  const gridStart = new Date(year, month, 1 - first.getDay());
  const cells = [];
  for(let i=0;i<42;i++){
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
    cells.push({
      iso: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`,
      day: d.getDate(),
      inMonth: d.getMonth() === month
    });
  }
  return cells;
}
function monthLabel(year, month){
  return new Date(year, month, 1).toLocaleDateString(undefined, { month:'long', year:'numeric' });
}
function fmtDateLong(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  if(iso === todayIso()) return 'Today';
  return dt.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
}
function addDaysIso(iso, days){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d + days);
  return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
}

// ---------- theme ----------
const THEME_PRESETS = {
  light: { paper:'#FAF6EF', ink:'#5C564C', brand:'#221F2C' },
  dark:  { paper:'#211E27', ink:'#E9E3D6', brand:'#D9B4E5' }
};
const DEFAULT_THEME = { mode:'light', accent:'#96263C', teal:'#236663', ...THEME_PRESETS.light };
let theme = { ...DEFAULT_THEME };

function applyTheme(){
  const root = document.documentElement;
  root.style.setProperty('--paper', theme.paper);
  root.style.setProperty('--ink', theme.ink);
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--teal', theme.teal);
  root.style.setProperty('--brand', theme.brand);
  root.style.colorScheme = theme.mode === 'dark' ? 'dark' : 'light';
  const themeColorMeta = document.querySelector('meta[name="theme-color"]');
  if(themeColorMeta) themeColorMeta.setAttribute('content', theme.paper);
}
async function persistTheme(){
  await sset('theme', JSON.stringify(theme), false);
}
async function loadTheme(){
  const raw = await sget('theme', false);
  if(raw){
    try{ const saved = JSON.parse(raw); theme = { ...DEFAULT_THEME, ...saved }; }
    catch(e){}
  }
  applyTheme();
}
function setThemeMode(mode){
  theme.mode = mode;
  Object.assign(theme, THEME_PRESETS[mode] || THEME_PRESETS.light);
  applyTheme();
  persistTheme();
  render();
}
function setThemeColor(key, value){
  theme[key] = value;
  applyTheme();
}
function resetTheme(){
  theme = { ...DEFAULT_THEME };
  applyTheme();
  persistTheme();
  render();
}

async function saveBirthday(dateStr){
  if(!dateStr) return;
  birthdays[me] = dateStr;
  await sset('birthday:' + me, JSON.stringify(dateStr), true);
  render();
  toast('Birthday saved');
}
async function clearBirthday(){
  delete birthdays[me];
  try{ await window.storage.delete('birthday:' + me, true); }catch(e){}
  render();
  toast('Birthday removed');
}

function isStandalone(){
  try{
    if(window.navigator && window.navigator.standalone === true) return true;
    if(typeof window.matchMedia === 'function') return window.matchMedia('(display-mode: standalone)').matches;
  }catch(e){}
  return false;
}
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function isAndroid(){ return /android/i.test(navigator.userAgent); }

const colorFor = (name) => {
  if(!participants) return 'var(--accent)';
  return name === participants[0] ? 'var(--accent)' : 'var(--teal)';
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function uid(){ return 'evt_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function statusOf(ev){
  if(ev.kind === 'personal' || ev.kind === 'birthday') return 'confirmed';
  const vals = participants.map(p => ev.responses[p]);
  if(vals.includes('declined')) return 'declined';
  if(vals.every(v => v === 'accepted')) return 'confirmed';
  return 'pending';
}
function needsMyResponse(ev){
  return statusOf(ev) === 'pending' && !(me in ev.responses);
}
function otherOf(name){ return participants.find(p => p !== name); }

// ---------- boot ----------
async function boot(){
  render_loading();
  await loadTheme();
  const raw = await sget('participants', true);
  if(raw){
    try{ participants = JSON.parse(raw); }catch(e){ participants = null; }
  }
  if(participants && participants.length === 2){
    const myRaw = await sget('me:' + deviceKey(), false);
    if(myRaw){
      try{ me = JSON.parse(myRaw); }catch(e){ me = null; }
    }
  }
  if(participants && me){
    await loadEvents();
    await loadBirthdays();
  }
  const seenTip = await sget('seen-install-tip', false);
  showInstallTip = !isStandalone() && !seenTip;
  render();
}

async function dismissInstallTip(){
  showInstallTip = false;
  await sset('seen-install-tip', JSON.stringify(true), false);
  render();
}
// personal storage is per-user already (scoped by account), single key is enough
function deviceKey(){ return 'v1'; }

async function loadEvents(){
  const keys = await slist('events:', true);
  const map = {};
  for(const k of keys){
    const raw = await sget(k, true);
    if(raw){
      try{ const ev = JSON.parse(raw); map[ev.id] = ev; }catch(e){}
    }
  }
  events = map;
}

async function loadBirthdays(){
  if(!participants) return;
  const map = {};
  for(const p of participants){
    const raw = await sget('birthday:' + p, true);
    if(raw){
      try{ map[p] = JSON.parse(raw); }catch(e){}
    }
  }
  birthdays = map;
}

function getBirthdayEntriesForDate(iso){
  if(!participants || !iso) return [];
  const [y,m,d] = iso.split('-').map(Number);
  const entries = [];
  for(const p of participants){
    const bday = birthdays[p];
    if(!bday) continue;
    const [by,bm,bd] = bday.split('-').map(Number);
    if(bm === m && bd === d){
      const age = y - by;
      const ageLabel = (age > 0 && age < 130) ? ` (turns ${age})` : '';
      entries.push({
        id: 'birthday-' + p + '-' + iso,
        kind: 'birthday',
        title: `${p}'s birthday${ageLabel}`,
        date: iso, time:'', endTime:'', location:'', link:'', description:'',
        image: null, checklist: [], createdBy: p, deleteRequests: {}, responses: {}
      });
    }
  }
  return entries;
}

// ---------- background sync ----------
// No live push connection exists, so we poll on an interval and whenever
// the tab/app regains focus, and only re-render if something changed so
// it doesn't interrupt someone mid-typing on the New tab.
let syncing = false;
async function syncEvents(){
  if(!participants || !me || syncing) return;
  syncing = true;
  try{
    const before = JSON.stringify(events) + JSON.stringify(birthdays);
    await loadEvents();
    await loadBirthdays();
    const after = JSON.stringify(events) + JSON.stringify(birthdays);
    if(before !== after && tab !== 'new' && !detailId){
      render();
    }
  } finally {
    syncing = false;
  }
}
setInterval(syncEvents, 15000);
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') syncEvents();
});

async function manualRefresh(){
  await loadEvents();
  await loadBirthdays();
  render();
  toast('Synced');
}
window.addEventListener('focus', syncEvents);

async function setupParticipants(mine, theirs){
  mine = mine.trim(); theirs = theirs.trim();
  if(!mine || !theirs) return;
  participants = [mine, theirs];
  await sset('participants', JSON.stringify(participants), true);
  me = mine;
  await sset('me:' + deviceKey(), JSON.stringify(me), false);
  await loadEvents();
  render();
}
async function chooseIdentity(name){
  me = name;
  await sset('me:' + deviceKey(), JSON.stringify(me), false);
  await loadEvents();
  render();
}
async function switchIdentity(){
  me = null;
  await sset('me:' + deviceKey(), JSON.stringify(null), false);
  render();
}

async function createEvent(data){
  const kind = data.kind || 'plan';
  const ev = {
    id: uid(),
    kind,
    title: data.title,
    date: data.date,
    time: data.time || '',
    endTime: data.endTime || '',
    location: data.location || '',
    link: data.link || '',
    description: data.description || '',
    image: data.image || null,
    checklist: data.checklist || [],
    createdBy: me,
    createdAt: new Date().toISOString(),
    responses: { [me]: 'accepted' },
    deleteRequests: {}
  };
  events[ev.id] = ev;
  await sset('events:' + ev.id, JSON.stringify(ev), true);
  detailId = null;
  showAddSheet = false;
  resetForm();
  if(kind === 'personal'){
    tab = 'calendar';
    selectedDate = ev.date;
    render();
    toast('Added to the calendar');
  } else {
    tab = 'requests';
    render();
    toast('Sent to ' + otherOf(me));
  }
}

async function createPersonalRecurring(base, startIso, days, untilIso){
  const start = new Date(startIso + 'T00:00:00');
  let end = new Date(untilIso + 'T00:00:00');
  if(end < start){ toast('Until date should be after the start date'); return; }
  const cap = new Date(start); cap.setDate(cap.getDate() + 365);
  if(end > cap) end = cap;
  let count = 0;
  const cursor = new Date(start);
  while(cursor <= end){
    if(days.includes(cursor.getDay())){
      const iso = `${cursor.getFullYear()}-${pad2(cursor.getMonth()+1)}-${pad2(cursor.getDate())}`;
      const ev = {
        id: uid(), kind: 'personal', title: base.title, date: iso, time: base.time || '',
        endTime: base.endTime || '',
        location: base.location || '', link: '', description: base.description || '', image: null,
        checklist: [], createdBy: me, createdAt: new Date().toISOString(),
        responses: { [me]: 'accepted' }, deleteRequests: {}
      };
      events[ev.id] = ev;
      await sset('events:' + ev.id, JSON.stringify(ev), true);
      count++;
    }
    cursor.setDate(cursor.getDate() + 1);
  }
  detailId = null;
  showAddSheet = false;
  resetForm();
  tab = 'calendar';
  selectedDate = startIso;
  render();
  toast(count ? `Added ${count} to the calendar` : 'No matching days in that range');
}

function resetForm(){
  formDraft = { title:'', date:'', time:'', endTime:'', location:'', link:'', desc:'' };
  formRepeat = { enabled:false, days:[], until:'' };
  formImage = null;
  formChecklist = [];
}

async function respond(id, decision){
  const ev = events[id];
  if(!ev) return;
  ev.responses[me] = decision;
  await sset('events:' + id, JSON.stringify(ev), true);
  render();
  toast(decision === 'accepted' ? "You're in!" : 'Declined');
}

async function toggleChecklistItem(id, itemId){
  const ev = events[id];
  if(!ev) return;
  const item = ev.checklist.find(i => i.id === itemId);
  if(!item) return;
  item.done = !item.done;
  await sset('events:' + id, JSON.stringify(ev), true);
  render();
}

async function deleteEvent(id){
  if(!confirm('Delete this?')) return;
  delete events[id];
  try{ await window.storage.delete('events:' + id, true); }catch(e){}
  detailId = null;
  render();
  toast('Deleted');
}

async function requestDelete(id){
  const ev = events[id];
  if(!ev) return;
  ev.deleteRequests = ev.deleteRequests || {};
  ev.deleteRequests[me] = true;
  if(participants.every(p => ev.deleteRequests[p])){
    delete events[id];
    try{ await window.storage.delete('events:' + id, true); }catch(e){}
    detailId = null;
    render();
    toast('Removed from both calendars');
    return;
  }
  await sset('events:' + id, JSON.stringify(ev), true);
  detailId = null;
  render();
  toast('Delete request sent to ' + otherOf(me));
}

async function keepEvent(id){
  const ev = events[id];
  if(!ev) return;
  ev.deleteRequests = {};
  await sset('events:' + id, JSON.stringify(ev), true);
  detailId = null;
  render();
  toast('Kept on the calendar');
}

// ---------- image handling ----------
function handleImageFile(file, cb){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h * (maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = w * (maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ---------- formatting ----------
function fmtDate(iso, timeStr){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const opts = { weekday:'short', month:'short', day:'numeric' };
  let s = dt.toLocaleDateString(undefined, opts);
  if(timeStr){
    const [hh,mm] = timeStr.split(':').map(Number);
    const t = new Date(); t.setHours(hh,mm);
    s += ' · ' + t.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  }
  return s;
}
function fmtTime(timeStr){
  if(!timeStr) return '';
  const [hh,mm] = timeStr.split(':').map(Number);
  const t = new Date(); t.setHours(hh,mm);
  return t.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
function fmtDateRange(iso, timeStr, endTimeStr){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  let s = dt.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  if(timeStr && endTimeStr) s += ' · ' + fmtTime(timeStr) + '–' + fmtTime(endTimeStr);
  else if(timeStr) s += ' · ' + fmtTime(timeStr);
  return s;
}
function isPast(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d, 23, 59);
  return dt < new Date();
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iconFor(status){
  if(status==='confirmed') return '✓';
  if(status==='declined') return '·';
  return '';
}

    bindInstallTip();

// ---- calendar tab ----
function renderCalendar(){
  const cells = buildMonthMatrix(calYear, calMonth);
  const todayIsoStr = todayIso();
  const weekdayLabels = ['S','M','T','W','T','F','S'];

  const cellsHtml = cells.map(c => {
    const dayEntries = Object.values(events).filter(e => e.date === c.iso && statusOf(e) === 'confirmed')
      .concat(getBirthdayEntriesForDate(c.iso));
    const dots = dayEntries.slice(0,3).map(e => {
      const color = e.kind === 'plan' ? 'var(--green)' : colorFor(e.createdBy);
      return `<span class="cal-dot" style="background:${color}"></span>`;
    }).join('');
    const classes = ['cal-cell'];
    if(!c.inMonth) classes.push('dim');
    if(c.iso === todayIsoStr) classes.push('today');
    if(c.iso === selectedDate) classes.push('selected');
    return `<button class="${classes.join(' ')}" data-day="${c.iso}">
      <span class="cal-daynum">${c.day}</span>
      <span class="cal-dots">${dots}</span>
    </button>`;
  }).join('');

  const birthdayEntries = getBirthdayEntriesForDate(selectedDate);
  const agendaEntries = Object.values(events)
    .filter(e => e.date === selectedDate && statusOf(e) === 'confirmed')
    .sort((a,b) => (a.time||'').localeCompare(b.time||''));

  const agendaHtml = (agendaEntries.length || birthdayEntries.length)
    ? birthdayEntries.map(birthdayCardHtml).join('') + agendaEntries.map(cardHtml).join('')
    : `<div class="empty" style="padding:20px 10px 8px;">
        <p>Nothing here yet.</p>
      </div>`;

  return `
  <div class="cal-header">
    <button class="cal-nav" data-cal-nav="-1">‹</button>
    <div style="display:flex; flex-direction:column; align-items:center; gap:1px;">
      <div class="cal-month-label">${monthLabel(calYear, calMonth)}</div>
      <button class="cal-today-btn" data-cal-today="1">Today</button>
    </div>
    <button class="cal-nav" data-cal-nav="1">›</button>
  </div>
  <div class="cal-weekdays">${weekdayLabels.map(w=>`<div>${w}</div>`).join('')}</div>
  <div class="cal-grid">${cellsHtml}</div>

  ${agendaHtml}

function renderRequests(requestCount){
  const all = Object.values(events);
  const plans = all.filter(e => e.kind !== 'personal');
  const needsMe = plans.filter(needsMyResponse);
  const waitingOnThem = plans.filter(e => e.createdBy === me && statusOf(e) === 'pending' && !needsMyResponse(e));
  const declined = plans.filter(e => statusOf(e) === 'declined');

  const proposeBtn = `<button class="btn primary block" data-open-plan-sheet="1" style="margin-bottom:22px;">+ Propose a plan</button>`;

  if(plans.length === 0){
    return proposeBtn + `<div class="empty">
      <div class="display">No plans yet</div>
      <p>Propose something for the two of you. It'll wait here until ${escapeHtml(otherOf(me))} accepts.</p>
    </div>`;
  }

  let html = proposeBtn;
  if(needsMe.length){
    html += `<div class="section-label">Waiting on you <span class="count-chip">${needsMe.length}</span></div>` + needsMe.map(cardHtml).join('');
  }
  if(waitingOnThem.length){
    html += `<div class="section-label">Waiting on ${escapeHtml(otherOf(me))}</div>` + waitingOnThem.map(cardHtml).join('');
  }
  if(declined.length){
    html += `<div class="section-label">Declined</div>` + declined.map(cardHtml).join('');
  }
  if(!needsMe.length && !waitingOnThem.length && !declined.length){
    html += `<div class="empty"><div class="display">You're all caught up</div><p>Confirmed plans live on the Calendar tab.</p></div>`;
  }
  return html;
}

function cardHtml(ev){
  const status = statusOf(ev);
  const isPersonal = ev.kind === 'personal';
  const thumb = ev.image
    ? `<img class="card-thumb" src="${ev.image}">`
    : `<div class="card-thumb placeholder">${isPersonal ? '🗓️' : '📌'}</div>`;
  const checklistDone = ev.checklist.filter(i=>i.done).length;
  const metaBits = [fmtDateRange(ev.date, ev.time, ev.endTime)];
  if(ev.location) metaBits.push(ev.location);
  let tagHtml = '';
  if(isPersonal){
    tagHtml = `<span class="tag" style="background:var(--paper-dim); color:${colorFor(ev.createdBy)}">${escapeHtml(ev.createdBy)}</span>`;
  } else if(status === 'pending'){
    if(needsMyResponse(ev)) tagHtml = `<span class="tag pending">Needs your reply</span>`;
    else tagHtml = `<span class="tag waiting">Waiting on ${escapeHtml(otherOf(me))}</span>`;
  } else if(status === 'confirmed'){
    tagHtml = `<span class="tag confirmed">Confirmed</span>`;
    if(ev.checklist.length) tagHtml += `<span class="tag" style="background:var(--paper-dim);color:var(--ink-soft)">${checklistDone}/${ev.checklist.length} packed</span>`;
    const dr = ev.deleteRequests || {};
    if(Object.keys(dr).length){
      tagHtml += `<span class="tag pending">Delete requested</span>`;
    }
  } else {
    tagHtml = `<span class="tag declined">Declined</span>`;
  }
  const showActions = needsMyResponse(ev);
  return `
  <button class="card status-${status}" data-open="${ev.id}" ${isPersonal ? `style="border-left-color:${colorFor(ev.createdBy)}"` : ''}>
    ${thumb}
    <div class="card-body">
      <p class="card-title">${escapeHtml(ev.title)}</p>
      <p class="card-meta">${escapeHtml(metaBits.join(' · '))}</p>
      <div class="card-tags">${tagHtml}</div>
      ${showActions ? `
      <div class="action-row" onclick="event.stopPropagation()">
        <button class="btn accept" data-respond="${ev.id}" data-decision="accepted">Accept</button>
        <button class="btn decline" data-respond="${ev.id}" data-decision="declined">Decline</button>
      </div>` : ''}
    </div>
  </button>`;
}

function renderDetail(ev){
  const status = statusOf(ev);
  const isMine = ev.createdBy === me;
  const isPersonal = ev.kind === 'personal';
  const checklistHtml = ev.checklist.length ? ev.checklist.map(item => `
    <div class="checklist-item ${item.done?'done':''}">
      <div class="box" data-toggle="${item.id}">${item.done?'✓':''}</div>
      <span>${escapeHtml(item.text)}</span>
    </div>`).join('') : `<p style="color:var(--ink-soft);font-size:13.5px;margin:0;">Nothing to bring, just show up.</p>`;

  const whoHtml = isPersonal
    ? `<div class="who-chip"><span class="me-dot" style="background:${colorFor(ev.createdBy)}"></span>${escapeHtml(ev.createdBy)}'s schedule</div>`
    : participants.map(p => {
        const r = ev.responses[p];
        let label = r === 'accepted' ? 'In' : r === 'declined' ? 'Declined' : 'Pending';
        return `<div class="who-chip"><span class="me-dot" style="background:${colorFor(p)}"></span>${escapeHtml(p)} · ${label}</div>`;
      }).join('');

  const actions = needsMyResponse(ev) ? `
    <div class="action-row">
      <button class="btn accept" data-respond="${ev.id}" data-decision="accepted" style="flex:1">Accept</button>
      <button class="btn decline" data-respond="${ev.id}" data-decision="declined" style="flex:1">Decline</button>
    </div>` : '';

  // Personal items, and plans that haven't been confirmed by both people yet, can be
  // removed directly by whoever created them. A confirmed shared plan belongs to both
  // of you, so deleting it takes mutual agreement instead.
  const isSharedConfirmed = !isPersonal && status === 'confirmed';
  const dr = ev.deleteRequests || {};
  const other = otherOf(me);
  let deleteSection = '';
  if(isSharedConfirmed){
    if(dr[me] && !dr[other]){
      deleteSection = `
      <div class="tag waiting" style="display:inline-block; margin-bottom:10px;">Waiting for ${escapeHtml(other)} to agree</div><br>
      <button class="btn ghost block" data-cancel-delete="${ev.id}">Cancel delete request</button>`;
    } else if(dr[other] && !dr[me]){
      deleteSection = `
      <p class="detail-desc" style="margin-bottom:10px;"><strong>${escapeHtml(other)}</strong> wants to delete this.</p>
      <div class="action-row">
        <button class="btn decline" data-keep="${ev.id}" style="flex:1">Keep it</button>
        <button class="btn accept" data-request-delete="${ev.id}" style="flex:1">Agree, delete</button>
      </div>`;
    } else {
      deleteSection = `<button class="btn ghost block" data-request-delete="${ev.id}">Request to delete</button>`;
    }
  } else if(isMine){
    deleteSection = `<button class="btn ghost block" id="delete-event">Delete</button>`;
  }

  return `
  <div class="overlay" id="overlay">
    <div class="sheet">
      <button class="sheet-close" id="sheet-close">✕</button>
      <div class="sheet-handle"></div>
      ${ev.image ? `<img class="detail-img" src="${ev.image}">` : ''}
      <h2 class="detail-title">${escapeHtml(ev.title)}</h2>
      <p class="detail-meta">${escapeHtml(fmtDateRange(ev.date, ev.time, ev.endTime))}${ev.location ? ' · ' + escapeHtml(ev.location) : ''}<br>${isPersonal ? 'Added by' : 'Proposed by'} ${escapeHtml(ev.createdBy)}</p>
      <div class="who-row">${whoHtml}</div>
      ${ev.description ? `<p class="detail-desc">${escapeHtml(ev.description)}</p>` : ''}
      ${ev.link ? `<a class="link-btn" href="${escapeHtml(ev.link)}" target="_blank" rel="noopener">🔗 Open link</a>` : ''}
      ${!isPersonal ? `
      <div class="section-label" style="margin-top:4px;">To bring / prep</div>
      ${checklistHtml}` : ''}
      <div style="margin-top:20px;">${actions}</div>
      ${deleteSection ? `<div style="margin-top:10px;">${deleteSection}</div>` : ''}
    </div>
  </div>`;
}

function bindMain(){
  document.getElementById('me-pill').onclick = () => {
    if(confirm('Switch who you are on this device?')) switchIdentity();
  };
  const refreshBtn = document.getElementById('refresh-btn');
  if(refreshBtn) refreshBtn.onclick = () => manualRefresh();
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.onclick = () => { tab = b.dataset.tab; detailId = null; render(); };
  });
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = () => { detailId = el.dataset.open; render(); };
  });
  document.querySelectorAll('[data-respond]').forEach(el=>{
    el.onclick = (e) => { e.stopPropagation(); respond(el.dataset.respond, el.dataset.decision); };
  });

  if(tab === 'calendar'){
    document.querySelectorAll('[data-day]').forEach(el=>{
      el.onclick = () => { selectedDate = el.dataset.day; render(); };
    });
    document.querySelectorAll('[data-cal-nav]').forEach(el=>{
      el.onclick = () => {
        calMonth += Number(el.dataset.calNav);
        if(calMonth < 0){ calMonth = 11; calYear--; }
        if(calMonth > 11){ calMonth = 0; calYear++; }
        render();
      };
    });
    const todayBtn = document.querySelector('[data-cal-today]');
    if(todayBtn) todayBtn.onclick = () => {
      const t = new Date();
      calYear = t.getFullYear(); calMonth = t.getMonth();
      selectedDate = todayIso();
      render();
    };
    const addForDay = document.querySelector('[data-add-for-day]');
    if(addForDay) addForDay.onclick = () => {
      formDraft.date = addForDay.dataset.addForDay;
      addSheetKind = 'personal';
      showAddSheet = true;
      render();
    };
  }

  if(tab === 'requests'){
    const proposeBtn = document.querySelector('[data-open-plan-sheet]');
    if(proposeBtn) proposeBtn.onclick = () => {
      addSheetKind = 'plan';
      showAddSheet = true;
      render();
    };
  }

  if(tab === 'settings'){
    document.querySelectorAll('[data-set-mode]').forEach(el=>{
      el.onclick = () => setThemeMode(el.dataset.setMode);
    });
    const bindColor = (id, key) => {
      const el = document.getElementById(id);
      if(!el) return;
      el.oninput = () => {
        setThemeColor(key, el.value);
        const hexEl = el.closest('.color-row').querySelector('.hex');
        if(hexEl) hexEl.textContent = el.value;
      };
      el.onchange = () => persistTheme();
    };
    bindColor('theme-accent', 'accent');
    bindColor('theme-teal', 'teal');
    bindColor('theme-paper', 'paper');
    bindColor('theme-ink', 'ink');
    const resetBtn = document.getElementById('theme-reset');
    if(resetBtn) resetBtn.onclick = () => resetTheme();

    const bdayInput = document.getElementById('birthday-me');
    if(bdayInput) bdayInput.onchange = () => saveBirthday(bdayInput.value);
    const bdayClear = document.getElementById('birthday-clear');
    if(bdayClear) bdayClear.onclick = () => clearBirthday();
  }

  const overlay = document.getElementById('overlay');
  if(overlay){
    overlay.onclick = (e) => { if(e.target === overlay){ detailId = null; render(); } };
    document.getElementById('sheet-close').onclick = () => { detailId = null; render(); };
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.onclick = () => toggleChecklistItem(detailId, el.dataset.toggle);
    });
    const delBtn = document.getElementById('delete-event');
    if(delBtn) delBtn.onclick = () => deleteEvent(detailId);
    document.querySelectorAll('[data-request-delete]').forEach(el=>{
      el.onclick = () => requestDelete(el.dataset.requestDelete);
    });
    document.querySelectorAll('[data-cancel-delete]').forEach(el=>{
      el.onclick = () => keepEvent(el.dataset.cancelDelete);
    });
    document.querySelectorAll('[data-keep]').forEach(el=>{
      el.onclick = () => keepEvent(el.dataset.keep);
    });
  }

  const addOverlay = document.getElementById('add-overlay');
  if(addOverlay){
    addOverlay.onclick = (e) => { if(e.target === addOverlay){ showAddSheet = false; resetForm(); render(); } };
    document.getElementById('add-close').onclick = () => { showAddSheet = false; resetForm(); render(); };
    if(addSheetKind === 'personal') bindPersonalForm();
    else bindPlanForm();
  }
}

function syncFormDraft(){
  const g = id => document.getElementById(id);
  if(g('f-title')) formDraft.title = g('f-title').value;
  if(g('f-date')) formDraft.date = g('f-date').value;
  if(g('f-time')) formDraft.time = g('f-time').value;
  if(g('f-time-end')) formDraft.endTime = g('f-time-end').value;
  if(g('f-location')) formDraft.location = g('f-location').value;
  if(g('f-link')) formDraft.link = g('f-link').value;
  if(g('f-desc')) formDraft.desc = g('f-desc').value;
}

function bindPersonalForm(){
  document.getElementById('f-repeat-toggle').onchange = (e) => {
    syncFormDraft();
    formRepeat.enabled = e.target.checked;
    if(formRepeat.enabled){
      const baseDate = formDraft.date || selectedDate;
      if(formRepeat.days.length === 0){
        const [y,m,d] = baseDate.split('-').map(Number);
        formRepeat.days = [new Date(y, m-1, d).getDay()];
      }
      if(!formRepeat.until) formRepeat.until = addDaysIso(baseDate, 56);
    }
    render();
  };
  document.querySelectorAll('[data-weekday]').forEach(el=>{
    el.onclick = () => {
      syncFormDraft();
      const day = Number(el.dataset.weekday);
      const i = formRepeat.days.indexOf(day);
      if(i === -1) formRepeat.days.push(day); else formRepeat.days.splice(i,1);
      render();
    };
  });
  const untilInput = document.getElementById('f-repeat-until');
  if(untilInput) untilInput.onchange = () => { formRepeat.until = untilInput.value; };

  document.getElementById('submit-personal').onclick = () => {
    syncFormDraft();
    const title = formDraft.title.trim();
    const date = formDraft.date;
    if(!title || !date){ toast('Add a title and date'); return; }
    const base = {
      title, time: formDraft.time, endTime: formDraft.endTime, location: formDraft.location.trim(), description: formDraft.desc.trim()
    };
    if(formRepeat.enabled){
      const until = document.getElementById('f-repeat-until').value || formRepeat.until;
      if(!until || formRepeat.days.length === 0){ toast('Pick days and an end date to repeat'); return; }
      createPersonalRecurring(base, date, formRepeat.days, until);
    } else {
      createEvent({ kind:'personal', title, date, time: base.time, endTime: base.endTime, location: base.location, description: base.description });
    }
  };
}

function bindPlanForm(){
  document.getElementById('img-drop').addEventListener('change', (e) => {
    if(e.target.id !== 'f-image') return;
    const file = e.target.files[0];
    if(!file) return;
    handleImageFile(file, (dataUrl) => {
      formImage = dataUrl;
      syncFormDraft();
      render();
    });
  });
  document.getElementById('add-check').onclick = (e) => {
    e.preventDefault();
    syncChecklistFromDom();
    syncFormDraft();
    formChecklist.push('');
    render();
    setTimeout(()=>{
      const rows = document.querySelectorAll('[data-check-idx]');
      if(rows.length) rows[rows.length-1].focus();
    }, 0);
  };
  document.querySelectorAll('[data-remove-check]').forEach(b=>{
    b.onclick = () => {
      syncChecklistFromDom();
      syncFormDraft();
      formChecklist.splice(Number(b.dataset.removeCheck), 1);
      render();
    };
  });
  document.getElementById('submit-event').onclick = () => {
    syncChecklistFromDom();
    const title = document.getElementById('f-title').value.trim();
    const date = document.getElementById('f-date').value;
    if(!title || !date){ toast('Add a title and date'); return; }
    const checklist = formChecklist.filter(t=>t.trim()).map(t => ({ id: uid(), text: t.trim(), done:false }));
    createEvent({
      title,
      date,
      time: document.getElementById('f-time').value,
      location: document.getElementById('f-location').value.trim(),
      link: document.getElementById('f-link').value.trim(),
      description: document.getElementById('f-desc').value.trim(),
      image: formImage,
      checklist
    });
    formImage = null;
    formChecklist = [];
  };
}
function syncChecklistFromDom(){
  document.querySelectorAll('[data-check-idx]').forEach(inp=>{
    formChecklist[Number(inp.dataset.checkIdx)] = inp.value;
  });
}

boot();
</script>
