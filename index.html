<title>Melissa's Creature Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: a dive from the surface down — hero at the waterline, then rating tiers as depth zones */
:root{
  --abyss:#04121c; --deep:#0a2433; --reef:#123a4d; --foam:#e8f4f6; --mist:#8fb3bf;
  --bite:#ff5a4e; --gold:#ffc94a;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--abyss);color:var(--foam);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#0e4a63 0%,#0a2433 62%,var(--abyss) 100%);padding-block:56px 70px}
.hero .wrap{position:relative;z-index:2}
.byline{font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:.82rem;color:var(--mist);margin:0}
.byline b{color:var(--foam)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(4rem,17vw,11rem);line-height:.88;margin:.12em 0 0;letter-spacing:.01em;color:var(--foam);text-shadow:0 6px 0 rgba(0,0,0,.25)}
h1 span{color:var(--bite)}
.tag{max-width:46ch;color:var(--mist);margin:18px 0 0;font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px;font-variant-numeric:tabular-nums}
.stats div{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mist)}
.stats strong{display:block;font-family:var(--display);font-weight:400;font-size:2rem;letter-spacing:0;color:var(--foam);line-height:1.1}
.water{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:1}
.fin{position:absolute;bottom:38px;left:-120px;width:90px;z-index:1;animation:swim 22s linear infinite}
@keyframes swim{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 240px))}}
@media (prefers-reduced-motion:reduce){.fin{animation:none;left:auto;right:8%}}

/* filters */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(4,18,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--reef)}
.bar.pinned{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-block:12px}
.chip{font:600 .88rem var(--body);color:var(--mist);background:transparent;border:1.5px solid var(--reef);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip:hover{color:var(--foam);border-color:var(--mist)}
.chip[aria-pressed="true"]{background:var(--foam);color:var(--abyss);border-color:var(--foam)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* tiers */
main{padding-block:28px 64px}
.tier{margin-top:40px}
.tier-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;border-bottom:2px solid var(--reef);padding-bottom:10px;margin-bottom:18px}
.tier-head h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,5vw,2.5rem);margin:0;letter-spacing:.02em;line-height:1}
.tier-head .stars{color:var(--gold);font-size:1.2rem;letter-spacing:2px}
.tier-head .count{margin-left:auto;color:var(--mist);font-size:.85rem;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--deep);border-radius:14px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:1.3rem;font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:3px 9px;border-radius:999px;background:var(--reef);color:var(--mist)}
.pill.prime{background:transparent;border:1px solid var(--mist)}
.plot{font-size:.9rem;color:var(--mist);margin:0}
.take{margin:0;font-size:.98rem}
.take::before{content:"Melissa: ";font-weight:800;color:var(--bite)}
.card .stars{color:var(--gold);letter-spacing:2px;font-size:1rem}
.tier.five .card{background:linear-gradient(160deg,#173f52,var(--deep) 70%)}
.tier.watch .card{background:transparent;border:1.5px dashed var(--reef)}
.empty{color:var(--mist);text-align:center;padding:40px 0}
footer{color:var(--mist);font-size:.82rem;text-align:center;padding-block:0 40px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
</style>

<header class="hero">
  <div class="wrap">
    <p class="byline">Ratings by <b>Melissa</b></p>
    <h1>CREATURE<br><span>MOVIES</span></h1>
    <div class="stats" id="stats"></div>
  </div>
  <svg class="fin" viewBox="0 0 90 60" aria-hidden="true"><path d="M8 58 C30 40 44 14 46 2 C58 20 70 42 86 58 Z" fill="#5f7f8c"/></svg>
  <svg class="water" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 Q75 10 150 30 T300 30 T450 30 T600 30 T750 30 T900 30 T1050 30 T1200 30 V70 H0Z" fill="#04121c"/></svg>
</header>

<div id="bar-spot"></div>
<nav class="bar" id="bar" aria-label="Filter movies">
  <div class="wrap" id="filters"></div>
</nav>

<main class="wrap" id="list"></main>
<footer>Stars are out of 5. Prime = watched on Prime Video.</footer>

<script>
const movies = [
  {t:"No Way Up",r:5,c:"Shark",plot:"Plane crash survivors trapped in a sinking cabin at the bottom of the ocean, with sharks outside and air running out.",take:"Really scary. Honestly super good and very suspenseful. It feels like you can't breathe because you feel like you're trapped too. Very good character development and an emotional plot."},
  {t:"Shark Night",r:5,c:"Shark",plot:"Seven college friends at a Louisiana lake house discover the lake is full of sharks, and the people who put them there.",take:"Loved it the first time! I like that it's another teen horror movie. Great attacks even though the CGI is bad (which is good). I like the twist."},
  {t:"Under Paris",r:5,c:"Shark",plot:"A shark turns up in the Seine.",take:"Really good! In French with subtitles. Super interesting concept and enough action to keep you hooked. Slow at the start, but once it ramps up it's super good."},
  {t:"Bait",r:5,c:"Shark",plot:"Survivors trapped in a flooded supermarket after a tsunami, with a shark inside.",take:"I loved this movie! Scary enough to keep everything suspenseful. Totally different premise and relatable characters. Good ending and an appropriate amount of deaths."},
  {t:"The Flood",r:5,c:"Gator",take:"Absolutely awesome. Terrible graphics, terrible acting, one of the best movies ever. I laughed the whole time. The premise is actually interesting."},
  {t:"Crawl",r:5,c:"Gator",take:"Up there with No Way Up. Actually scary and suspenseful, keeps you on the edge of your seat, and the dog survives! Just enough deaths to keep it interesting. Super realistic alligators. Fantastic."},
  {t:"The Black Demon",r:4,c:"Shark",prime:1,take:"Bad acting (the dad is the worst but it's hilarious), but a good movie overall. Very interesting storyline. Slow start."},
  {t:"Shark Lake",r:4,c:"Shark",prime:1,take:"The worst acting, and it's awesome. Basically the same premise as Shark Night. Pretty slow, but the acting is so bad it distracts you. Good ending, profoundly stupid movie. A good laugh."},
  {t:"Lake Placid 1, 2 & 3",r:4,c:"Croc",take:"Cult classics and super fun to watch. I love all of them; they're comfort movies. Awful acting, awful graphics, and somehow great."},
  {t:"Anaconda",r:4,c:"Snake",take:"Another cult classic. I really loved it because it has aspects of a real film with all the B-movie qualities. High-profile actors in a B movie is interesting. Very slow in the beginning."},
  {t:"Maneater",r:3,c:"Shark",plot:"Friends on a Hawaiian vacation get stranded and stalked by a great white, and team up with a local sea captain to survive.",take:"Kind of good, would probably watch again. Super bad acting and CGI, which I kinda liked. Trace Adkins is in it. The over-the-top acting makes it funny, and the unlikely friendship between the two leads is nice."},
  {t:"Rogue",r:3,c:"Croc",take:"Honestly the best graphics I've seen. The plot is middle of the road and gets pretty good as it goes, with a definite twist. My main problem: the dog dies."},
  {t:"Something in the Water",r:2,c:"Shark",take:"Another played-out concept, basically The Reef. A little better because the characters are more relatable and there's slightly more action. Probably wouldn't watch again."},
  {t:"Into the Deep",r:1,c:"Shark",plot:"Modern-day pirates force tourists to dive for sunken drugs in shark-infested water.",take:"Terrible. The acting is bad, and not in a good way, and the whole thing is so dumb. Very slow. I wondered why I watched it."},
  {t:"The Reef",r:1,c:"Shark",prime:1,take:"All-around bad movie. Played-out concept, no real action, really slow."},
  {t:"Shark Bait",r:1,c:"Shark",prime:1,take:"Another movie about people stranded in the ocean. Not even remotely enough shark footage. Would never watch again."},
  {t:"The Bayou",r:0,c:"Gator"},{t:"Gator Lake",r:0,c:"Gator"},{t:"The Croc",r:0,c:"Croc"},
  {t:"Fear Below",r:0,c:"Shark"},{t:"The Last Breath",r:0,c:"Shark"},{t:"Thrash",r:0,c:"Shark"}
];
const tiers = [
  {r:5,name:"Apex Predators",cls:"five"},
  {r:4,name:"Great Whites",cls:""},
  {r:3,name:"Middle of the Reef",cls:""},
  {r:2,name:"Bottom Feeders",cls:""},
  {r:1,name:"Chum",cls:""},
  {r:0,name:"Still to Rate",cls:"watch"}
];
const filters = [
  ["all","All"],["Shark","Sharks"],["gatorcroc","Gators & crocs"],["Snake","Snakes"],["5","5 stars only"]
];
const stars = n => "★".repeat(n) + "☆".repeat(5-n);
const esc = s => s.replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
let current = "all";

const rated = movies.filter(m => m.r);
document.getElementById("stats").innerHTML =
  `<div><strong>${rated.length}</strong>rated</div>
   <div><strong>${rated.filter(m=>m.r===5).length}</strong>five-star</div>`;

const fBox = document.getElementById("filters");
filters.forEach(([k,label]) => {
  const b = document.createElement("button");
  b.className = "chip"; b.id = "f-"+k; b.textContent = label;
  b.setAttribute("aria-pressed", k===current);
  b.onclick = () => { current = k; fBox.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); render(); };
  fBox.appendChild(b);
});

function match(m){
  if(current==="all") return true;
  if(current==="5") return m.r===5;
  if(current==="gatorcroc") return m.c==="Gator"||m.c==="Croc";
  return m.c===current;
}
const creature = {Shark:"Shark",Gator:"Alligator",Croc:"Crocodile",Snake:"Snake"};

function render(){
  const list = document.getElementById("list");
  let html = "";
  tiers.forEach(t => {
    const ms = movies.filter(m => m.r===t.r && match(m));
    if(!ms.length) return;
    html += `<section class="tier ${t.cls}"><div class="tier-head"><h2>${t.name}</h2>${t.r?`<span class="stars" aria-label="${t.r} stars">${stars(t.r)}</span>`:""}<span class="count">${ms.length} ${ms.length===1?"movie":"movies"}</span></div><div class="grid">`;
    ms.forEach(m => {
      html += `<article class="card"><h3>${esc(m.t)}</h3><div class="meta"><span class="pill">${creature[m.c]}</span>${m.prime?'<span class="pill prime">Prime</span>':""}${m.r?"":'<span class="pill">Not rated yet</span>'}</div>`
        + (m.plot?`<p class="plot">${esc(m.plot)}</p>`:"")
        + (m.take?`<p class="take">${esc(m.take)}</p>`:"")
        + `</article>`;
    });
    html += `</div></section>`;
  });
  list.innerHTML = html || `<p class="empty">Nothing in these waters yet.</p>`;
}
render();

// Pin the filter bar to the top of the screen once you scroll past it
const bar = document.getElementById("bar"), spot = document.getElementById("bar-spot");
function pin(){
  const pinned = bar.classList.contains("pinned");
  const top = spot.getBoundingClientRect().top;
  if(!pinned && top <= 0){ spot.style.height = bar.offsetHeight + "px"; bar.classList.add("pinned"); }
  else if(pinned && top > 0){ bar.classList.remove("pinned"); spot.style.height = "0"; }
}
window.addEventListener("scroll", pin, {passive:true});
document.addEventListener("scroll", pin, {passive:true, capture:true});
window.addEventListener("resize", pin);
pin();
</script>
